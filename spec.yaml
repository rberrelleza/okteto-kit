schemaVersion: "1"
name: okteto
displayName: okteto
description: Give your sandbox an isolated, production-like environment on your infrastructure to build, test, and verify against real services and data
kind: mixin
caps:
 network:
   allow:
    - demo.okteto.dev
    - "*.demo.okteto.dev"
    - get.okteto.com
    - downloads.okteto.com

# Maps the Okteto API domain to the "okteto" secret registered on the host with
# `sbx secret set-custom`, and tells the proxy which header to inject it into.
# The token value is NOT declared here and never enters the sandbox.
network:
  serviceDomains:
    demo.okteto.dev: okteto
  serviceAuth:
    okteto:
      headerName: Authorization
      valueFormat: "Bearer %s"

commands:
  install:
  - description: Install Okteto
    # Bump OKTETO_VERSION to upgrade. Asset suffixes are x86_64 and arm64,
    # which do not match `uname -m` one-for-one, hence the case mapping.
    # Deliberately `set -eu` and not `set -euo pipefail`: install commands run
    # via `sh -c`, and /bin/sh on Debian/Ubuntu is dash, which has no pipefail.
    command: |
      set -eu
      OKTETO_VERSION=3.21.0
      case "$(uname -m)" in
        x86_64)  ARCH=x86_64 ;;
        aarch64|arm64) ARCH=arm64 ;;
        *) echo "unsupported sandbox arch: $(uname -m) (expected x86_64 or aarch64)" >&2; exit 1 ;;
      esac
      URL="https://downloads.okteto.com/cli/stable/${OKTETO_VERSION}/okteto-Linux-${ARCH}"
      curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/okteto "$URL"
      curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/okteto.sha256 "${URL}.sha256"
      echo "$(awk '{print $1}' /tmp/okteto.sha256)  /tmp/okteto" | sha256sum -c -
      install -m 0755 /tmp/okteto /usr/local/bin/okteto
      rm -f /tmp/okteto /tmp/okteto.sha256
      okteto version

environment:
  variables:
    # Not a secret, and it must match caps.network.allow, so it stays static.
    OKTETO_CONTEXT: https://demo.okteto.dev